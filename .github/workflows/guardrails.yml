# The per-repo footprint of ADR-085 §C.11. Everything it runs lives in exeris-systems/.github;
# this file only says which gates apply here and how strictly.
#
# ONE REVIEW, ONE VERDICT, ONE PUBLISHER. The shared routine judges the pull request, its pages, its
# records, the comments in its code and what the code does; this repository's own rules reach it as
# `repo-routine`. The reviewer may not publish (ADR-087 §A.3), so the verdict is posted by
# `exeris-bot` and read by a check.
#
# THIS FILE IS ONE BLOB ON EVERY BRANCH. `claude-code-action` refuses to start when the workflow it
# runs under differs in any byte from the default branch's copy, so a branch whose copy has drifted
# gets no review at all. Anything a single branch needs goes in a workflow file of its own.
#
# WHY THE PINS ARE SHAs. Dependabot keeps `github-actions` current here (`dependabot.yml`), so a SHA
# is immune to a moved ref and still advances. The trailing comment names the ref the SHA came from:
# that repository publishes no tags, and `@main` stays true whichever commit the SHA is.
#
# WHAT THE PIN DOES NOT PIN. The review routine, its plan and its composition are read from that
# repository's default branch whatever SHA is written here, by design: a change to the routine is a
# change to every review and lands everywhere on merge.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: a review is asked for by applying `needs-review`, and a person's
    # review is recorded by applying `human-reviewed`.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  # Not `true`. Publication removes the review label, and that removal is an `unlabeled` event whose
  # run would cancel the run still publishing. Bot-triggered runs queue instead of cancelling; human
  # pushes still collapse.
  cancel-in-progress: ${{ !endsWith(github.actor, '[bot]') }}
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares. Omitting one does not run that job with less: it
# makes the whole file an invalid workflow, rejected before any gate runs. The last two are
# docs-review's: `id-token: write` for the OIDC exchange the review action performs, `issues: read`
# for the debt issues a review finding becomes.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write

jobs:
  docs:
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@ab910c5757900b592a66887c99651e92711af2af # exeris-systems/.github@main
    with:
      # ramp, not strict: in ramp the gate fails only on files the pull request touches. Measured on
      # this tree, strict reports 42 frontmatter errors across 40 files that no pull request here
      # created. Flip to strict when that backfill has landed.
      mode: ramp
      # Off: docs/ holds no page typed `subsystem` or `module`, which is what the check reads.
      section-check: false
  commits:
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@ab910c5757900b592a66887c99651e92711af2af # exeris-systems/.github@main
  pr-body:
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@ab910c5757900b592a66887c99651e92711af2af # exeris-systems/.github@main
  # The review of ADR-085 §J.33, published under the organisation's identity by ADR-087 §B.
  #
  # `needs` puts it after the gates it complements and `l1-results` hands it their conclusions: the
  # reviewer's harness denies the network, so a gate it is asked to read for itself lands in the
  # verdict as `not-run`. `always()`, because a review that vanishes from the checks when its gates go
  # red is the failure this arrangement exists to prevent. A bot's event runs the job too: the
  # publishing half answers it from the standing verdict, and the model does not start on one.
  #
  # THE REVIEW RUNS ON READINESS, not on every push: when the pull request is opened, reopened,
  # marked ready for review, or labelled `needs-review` by a person. A push afterwards leaves the
  # standing verdict covering an older commit, and the check says so until a review is asked for
  # again.
  docs-review:
    needs: [docs, commits, pr-body]
    if: ${{ always() }}
    uses: exeris-systems/.github/.github/workflows/docs-review.yml@ab910c5757900b592a66887c99651e92711af2af # exeris-systems/.github@main
    with:
      # `docs-review / publish / verdict` is the check this adds, red when the verdict is BLOCKED,
      # absent, invalid, or resting on a mandatory gate that did not run. It is not a required
      # context here; making it one is a branch-protection change, not a change to this file.
      publish: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}"}
      # This repository's own rules, applied after the shared routine's parts and under its
      # severity tags and verdict schema. Read at the BASE commit, never at the pull request's ref:
      # a pull request does not write the rules it is judged by.
      repo-routine: docs/repo-review-rules.md
      # One model run per part, composed into one verdict and one comment. `pr` and `repo` run on
      # every pull request; `docs`, `records`, `code-docs` and `code` where the diff has their
      # files. A part that leaves no verdict makes the check red.
      review-in-parts: true
    # Named, not `secrets: inherit`: the job needs three, and inherit would hand it every secret this
    # repository has.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
