# The per-repo footprint of ADR-085 §C.11. Everything it runs lives in exeris-systems/.github;
# this file only says which gates apply here and how strictly.
#
# ONE REVIEW, ONE VERDICT, ONE PUBLISHER. The shared routine judges the pull request, its pages, its
# records, the comments in its code and what the code does; this repository's own rules reach it as
# `repo-routine`. The reviewer may not publish (ADR-087 §A.3), so the verdict is posted by
# `exeris-bot` and read by a check.
#
# THIS FILE IS ONE BLOB ON EVERY BRANCH. `claude-code-action` refuses to start when the workflow it
# runs under differs in any byte from the default branch's copy, so a branch whose copy has drifted
# gets no review at all. Anything a single branch needs goes in a workflow file of its own.
#
# WHY THE PINS ARE SHAs. Dependabot keeps `github-actions` current here (`dependabot.yml`), so a SHA
# is immune to a moved ref and still advances. The trailing comment names the ref the SHA came from:
# that repository publishes no tags, and `@main` stays true whichever commit the SHA is.
#
# WHAT THE PIN DOES NOT PIN. The review routine, its plan and its composition are read from that
# repository's default branch whatever SHA is written here, by design: a change to the routine is a
# change to every review and lands everywhere on merge.
name: guardrails
on:
  pull_request:
    # labeled/unlabeled matter: a review is asked for by applying `needs-review`, and a person's
    # review is recorded by applying `human-reviewed`.
    #
    # `closed` is not a gate event and is here for one job: the judgement of ADR-087 §C.16, which
    # reads what the human did with the review once there is a history to read. Every other job
    # skips it explicitly — a gate on a pull request that can no longer merge decides nothing.
    types: [opened, edited, synchronize, ready_for_review, labeled, unlabeled, closed]
concurrency:
  group: guardrails-${{ github.event.pull_request.number }}
  # Not `true`. Publication removes the review label, and that removal is an `unlabeled` event whose
  # run would cancel the run still publishing. Bot-triggered runs queue instead of cancelling; human
  # pushes still collapse.
  # The close is kept out of the collapse by its own clause: the human who merges is no `[bot]`, so
  # without it the merge cancels the run still publishing the verdict and the judgement after it.
  cancel-in-progress: ${{ github.event.action != 'closed' && !endsWith(github.actor, '[bot]') }}
# A called workflow can only NARROW what the caller grants, never raise it, so this block is the
# union of what every called workflow declares. Omitting one does not run that job with less: it
# makes the whole file an invalid workflow, rejected before any gate runs. The last two are
# review's: `id-token: write` for the OIDC exchange the review action performs, `issues: read`
# for the debt issues a review finding becomes.
permissions:
  contents: read
  pull-requests: read
  issues: read
  id-token: write
  # `actions: read` belongs to `judge` alone: the judgement compares the commit a review READ with
  # the head the pull request ended at, and the first is the reviewing run's own `head_sha`, which
  # the platform states on the Actions API and nowhere else independent of the record being judged.
  actions: read

jobs:
  docs:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/docs-lint.yml@bfb55570c910290c92e1c537aab785a725997fa0 # exeris-systems/.github@main
    with:
      # ramp, not strict: in ramp the gate fails only on files the pull request touches. Measured on
      # this tree, strict reports 42 frontmatter errors across 40 files that no pull request here
      # created. Flip to strict when that backfill has landed.
      mode: ramp
      # Off: docs/ holds no page typed `subsystem` or `module`, which is what the check reads.
      section-check: false
  commits:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/commit-lint.yml@bfb55570c910290c92e1c537aab785a725997fa0 # exeris-systems/.github@main
  pr-body:
    if: ${{ github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/pr-body-check.yml@bfb55570c910290c92e1c537aab785a725997fa0 # exeris-systems/.github@main
  # The review of ADR-085 §J.33, published under the organisation's identity by ADR-087 §B.
  #
  # `needs` puts it after the gates it complements and `l1-results` hands it their conclusions: the
  # reviewer's harness denies the network, so a gate it is asked to read for itself lands in the
  # verdict as `not-run`. `always()`, because a review that vanishes from the checks when its gates go
  # red is the failure this arrangement exists to prevent. A bot's event runs the job too: the
  # publishing half answers it from the standing verdict, and the model does not start on one.
  #
  # THE REVIEW RUNS ON READINESS, not on every push: when the pull request is opened, reopened,
  # marked ready for review, or labelled `needs-review` by a person. A push afterwards leaves the
  # standing verdict covering an older commit, and the check says so until a review is asked for
  # again.
  review:
    needs: [docs, commits, pr-body]
    if: ${{ always() && github.event.action != 'closed' }}
    uses: exeris-systems/.github/.github/workflows/review.yml@210e9a398349e89729fe06a16b5d89461f18e533 # exeris-systems/.github@main
    with:
      # `review / verdict` is the check this adds, red when the verdict is BLOCKED,
      # absent, invalid, or resting on a mandatory gate that did not run. It is not a required
      # context here; making it one is a branch-protection change, not a change to this file.
      publish: true
      # CAPTURE IS THE SECOND OPT-IN, and a separate decision from the first. With it on, the run
      # becomes a row in the organisation's execution dataset (ADR-087 §C.13-§C.17): the runner's
      # execution log is committed to the streams repository as content, a run record is assembled
      # from what the producing job exported about itself, and the day's rows reach the inbox as
      # one pull request per repository per day.
      #
      # IT RUNS INSIDE THE PUBLISHING HALF, so it needs `publish: true` as well: with publication
      # off there is no job for it to be a part of, and `capture: true` alone runs nothing and
      # says nothing about having run nothing.
      #
      # It needs the two EXERIS_INBOX_* secrets below and NO new permission: the capture job reads
      # the repository and the pull request, both of which the block at the top already grants, and
      # every write goes through the App's installation token. Without the secrets the job reports
      # that it has no identity to write under and writes nothing; the review and its gate are
      # unaffected either way.
      capture: true
      l1-results: >-
        {"docs-lint": "${{ needs.docs.result }}",
         "commit-lint": "${{ needs.commits.result }}",
         "pr-body-check": "${{ needs.pr-body.result }}"}
      # This repository's own rules, applied after the shared routine's parts and under its
      # severity tags and verdict schema. Read at the BASE commit, never at the pull request's ref:
      # a pull request does not write the rules it is judged by.
      repo-routine: docs/repo-review-rules.md
      # The scripts the agent manifest names under `scripts:`, run by CI because the reviewer may not
      # run them. Their output is evidence for T1–T7 and the agent layer, not a gate: a failure here
      # reaches the verdict through the reviewer, and the job stays green. PyYAML first, because the
      # hook dispatcher denies every command when it cannot parse `hooks.yaml`, and the deny check
      # would then report every allowed command as refused. Each script runs whatever the one before
      # it did, and the exit code the reviewer reads is non-zero if any of them failed.
      repo-checks: >-
        pip install --quiet pyyaml;
        rc=0;
        bash tools/hook-deny-check/hook-deny-check.sh || rc=1;
        bash tools/eval-consistency-check/eval-consistency-check.sh || rc=1;
        exit $rc
      # One model run per part, composed into one verdict and one comment. `pr` and `repo` run on
      # every pull request; `docs`, `records`, `code-docs` and `code` where the diff has their
      # files. A part that leaves no verdict makes the check red.
      review-in-parts: true
    # Named, not `secrets: inherit`: the job needs five, and inherit would hand it every secret this
    # repository has.
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
      # THE PEN, which `capture: true` above writes with. A caller may pass only a secret the called
      # workflow DECLARES: one it does not declare is not ignored, it makes the whole file an
      # invalid workflow in the adopting repository, on the first push, with no logs — taking every
      # gate in this file down with it, not only this job.
      #
      # They are optional exactly as the two lines above are: an organisation secret that is not set
      # arrives as an empty string, and the capture job then says so and writes nothing. They are
      # named rather than inherited for the reason the others are.
      exeris_inbox_app_id: ${{ secrets.EXERIS_INBOX_APP_ID }}
      exeris_inbox_private_key: ${{ secrets.EXERIS_INBOX_PRIVATE_KEY }}
  # The other half of the record, and the only job here that runs on `closed`. A review-domain run
  # record is complete when the review ends and its outcome is `UNKNOWN`: the oracle has not judged
  # yet. `review-disposition` judges when the pull request closes — per finding, from what the human
  # did with it — and its verdict is appended as its own record keyed by the run's id (ADR-087
  # §C.16). It is not a gate: the pull request is closed, it publishes no check a branch protection
  # rule can name, and it posts nothing to the pull request.
  judge:
    if: ${{ github.event.action == 'closed' }}
    uses: exeris-systems/.github/.github/workflows/judge-review.yml@bfb55570c910290c92e1c537aab785a725997fa0 # exeris-systems/.github@main
    secrets:
      exeris_bot_app_id: ${{ secrets.EXERIS_BOT_APP_ID }}
      exeris_bot_private_key: ${{ secrets.EXERIS_BOT_PRIVATE_KEY }}
      exeris_inbox_app_id: ${{ secrets.EXERIS_INBOX_APP_ID }}
      exeris_inbox_private_key: ${{ secrets.EXERIS_INBOX_PRIVATE_KEY }}
