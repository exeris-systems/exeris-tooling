name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: mvn verify (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 25 is the release-bearing row — the baseline the reactor compiles at and the
        # toolchain a published artifact must come from. 26 is forward-compatibility:
        # it catches source that stops compiling on a newer JDK, which a single row
        # would surface only downstream. Same shape as the SDK's matrix.
        #
        # Branch protection requires the 25 row. The 26 row runs on
        # every PR and reports, but a red 26 does not block a merge — which is the point:
        # forward-compatibility is information, not a gate on the release-bearing line.
        java: ['25', '26']

    steps:
      - name: Checkout exeris-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: exeris-tooling

      # CI builds the SDK from source and `mvn install`s it (NOT GitHub Packages),
      # so this ref decides which SDK version lands in the local repo, and it
      # must match exeris.sdk.version in the BOM.
      #
      # Tracking `main`: the BOM pins 0.12.0-SNAPSHOT, and `main` is the only
      # ref that builds it. The cost is that a moving ref lets an unrelated SDK
      # commit turn this build red, and it ends with the release: when the SDK
      # tags v0.12.0, this returns to `ref: v0.12.0` in the same change that pins
      # the final version. No tooling release is cut while this says `main`.
      - name: Checkout exeris-sdk (main — 0.12.0-SNAPSHOT, matches exeris.sdk.version in the BOM)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: exeris-systems/exeris-sdk
          ref: main
          path: exeris-sdk

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # A released coordinate is resolved from Maven Central, and a cached copy of the same
      # coordinate published before the release is purged. Maven never re-fetches a release it
      # already holds, so an ~/.m2 restored by the cache above would otherwise keep serving a
      # pre-release jar under the final version. The kernel jars are re-fetched from Central on
      # every run; that is a few megabytes.
      - name: Purge cached exeris-kernel artefacts
        run: rm -rf ~/.m2/repository/eu/exeris/exeris-kernel*

      # japicmp.skip mirrors what the SDK's own CI passes, and it is required from
      # v0.10.0 on: that release introduced a `semver-gate` japicmp execution bound
      # to `verify`, which `install` runs. The gate resolves the previous release
      # jar as its baseline, and no SDK release is on Maven Central yet (the SDK
      # follows the kernel there), so a runner has nothing to resolve. An absent baseline is configured to FAIL
      # rather than report "no breaks found", which is the correct posture for the
      # SDK and simply not our gate to run: we are building its jars to get the
      # types on our classpath, not policing its API compatibility.
      #
      # Not needed before now — v0.9.0 had no such execution, which is why this
      # step survived the previous pin unchanged.
      #
      # maven.javadoc.skip for the same reason one step further: `attach-javadocs`
      # built two javadoc jars nothing here consumes, at the cost of ~200 "no
      # comment" warnings per run. Those are the SDK's own docs debt, reported
      # against SDK sources, and reading them in this repo's log teaches only that
      # our log is noisy. They belong to the SDK's build, where they are actionable.
      - name: Install exeris-sdk to local Maven repo
        working-directory: exeris-sdk
        run: mvn -B -ntp -DskipTests -Djapicmp.skip=true -Dmaven.javadoc.skip=true install

      - name: mvn -B verify (exeris-tooling)
        working-directory: exeris-tooling
        # No -U. The SDK SNAPSHOT is built into the local repo by the step above
        # rather than fetched, so there is no remote SNAPSHOT to re-check. The
        # kernel resolves from Maven Central, at its final 0.12.0 release. -U
        # belongs back only if a SNAPSHOT ever arrives over the wire.
        #
        # No settings file: every remote dependency comes from Central, the only
        # repository a consumer of the published POMs has.
        run: mvn -B -ntp verify

  # exeris-codegen-ts is the TypeScript / Angular emitter sibling of
  # exeris-codegen-java. It is NOT a Maven module — vitest drives its
  # tests + coverage. Lives in a parallel job so the JVM matrix and
  # Node matrix can evolve independently.
  #
  # Branch protection requires exactly two checks: "mvn verify (JDK 25)" and
  # "vitest run --coverage (exeris-codegen-ts)". "ng build (generated sample app)"
  # runs on every PR but is NOT in that list — an earlier version of this comment
  # claimed it was, which was never true. Adding it is a branch-protection edit and
  # a deliberate decision, not something a workflow comment can assert into being.
  ts-coverage:
    name: vitest run --coverage (exeris-codegen-ts)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exeris-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exeris-codegen-ts/package-lock.json

      # @exeris/codegen-ts versions in lockstep with the Maven reactor; package.json and
      # package-lock.json must carry the root pom's project version. Dependency-free, so it runs
      # before npm ci.
      - name: version lockstep (package.json == pom.xml)
        working-directory: exeris-codegen-ts
        run: npm run -s check:version

      - name: npm ci (exeris-codegen-ts)
        working-directory: exeris-codegen-ts
        run: npm ci

      - name: vitest run --coverage (exeris-codegen-ts)
        working-directory: exeris-codegen-ts
        run: npm run test:coverage

      # T20 FE build gate (fast, Angular-free): generate a sample app and type-check
      # its data layer (enums + types + Zod schemas — the files that import only
      # `zod`). Catches the enum/schema cross-reference breakage cheaply on every run.
      # The full component/template build is the separate fe-app-build job below.
      - name: verify generated frontend (tsc --noEmit, data layer)
        working-directory: exeris-codegen-ts
        run: npm run verify:generated

  # Full FE build gate: generate a complete sample app and `ng build` it — the catch
  # for component/service/template breakage (the layer that needs @angular/*), the FE
  # analog of KernelCodegenCompileTest. Heavier (installs Angular), so a separate job.
  fe-app-build:
    name: ng build (generated sample app)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exeris-tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exeris-codegen-ts/package-lock.json

      - name: npm ci + build (exeris-codegen-ts)
        working-directory: exeris-codegen-ts
        run: |
          npm ci
          npm run build

      - name: Generate sample Angular app
        working-directory: exeris-codegen-ts
        run: node scripts/gen-sample-app.mjs "$RUNNER_TEMP/fe-sample"

      # @exeris/ui-kit is on the public npm registry. The sample installs it without a
      # token or an .npmrc, exactly as a real consumer does, so the gate validates the
      # published tarball, not a local source checkout.
      - name: npm install + ng build (generated app)
        working-directory: ${{ runner.temp }}/fe-sample
        run: |
          npm install --no-audit --no-fund
          npx ng build --configuration development

      # T2 (ADR-058): the gate RUNS the emitted specs. A generated test that is only
      # type-checked proves nothing — the same ruling the Java half's GeneratedTestsE2ETest
      # carries. The sample above is generated with `generateTests` on, so this executes the
      # emitted *.schema.spec.ts and *.service.spec.ts through the emitted Vitest runner.
      - name: ng test (emitted specs, generated app)
        working-directory: ${{ runner.temp }}/fe-sample
        run: npx ng test

      # The backend-less shape: no entity, only @View pages with authored content, so the scaffold
      # carries no HTTP wiring. Built here because the full sample above always has a backend and
      # cannot show that the scaffold compiles without one. Same job, so the install reuses the npm
      # cache the first app just filled.
      - name: Generate view-only Angular app (backend-less)
        working-directory: exeris-codegen-ts
        run: node scripts/gen-sample-app.mjs "$RUNNER_TEMP/fe-view-only" --view-only

      - name: npm install + ng build (view-only app)
        working-directory: ${{ runner.temp }}/fe-view-only
        run: |
          npm install --no-audit --no-fund --prefer-offline
          npx ng build --configuration development
