name: release to maven central and npmjs

# Two triggers, and the split is what each one is for.
#
# **A tag is the release.** `v0.9.0` on a commit that is on `main` builds, signs and uploads an
# unpublished deployment, then runs the readiness gate and attests. A push to a BRANCH fires this not at all, so a CI fix landing on `main` releases nothing.
#
# **The dispatch is the dry run.** With `upload` unchecked it builds, signs and runs every gate while
# touching nothing remote, from any branch: the cheap way to find out whether a change broke the
# release path before a tag depends on it.
#
# `autoPublish=false` in the root POM's `release` profile means an upload creates a DEPLOYMENT that a
# person still has to Publish in the Central Portal, and an unpublished deployment can be Dropped. So
# a mistyped tag costs a dropped deployment. What does need guarding is which commit a tag points at
# and whether its version agrees with the pom; both are checked below.
#
# Every dependency resolves from Maven Central here, as it will for a consumer of the published
# POMs: neither the POMs nor .github/maven-settings.xml name another repository. That is what
# enforces the release order kernel → SDK → tooling: a tooling release whose kernel or SDK pin is not on Central fails to
# resolve before anything is signed.
#
# Same shape as exeris-sdk's release.yml, including the single Maven invocation: the kernel gates and
# uploads in two builds and proves them byte-identical, which needs `project.build.outputTimestamp`;
# this reactor does not set it, so two builds differ and the gated bytes would not be the uploaded
# ones.
#
# **The same tag releases @exeris/codegen-ts to npmjs** (ADR-092, lockstep), and npm goes second.
# Both registries are immutable, but only the Maven half has an undo: an unpublished Central
# deployment can be Dropped, while an npm version, once published, can never be reused. So the npm
# job runs only after the Maven job (upload validated, readiness gate passed), in the `npm-publish`
# environment, and before publishing it waits for the Maven release to be visible on Maven Central.
# The order a release follows is therefore: tag → Maven deployment uploaded → a person presses
# Publish in the Central Portal → the npm job (approved in the environment, when it has a required
# reviewer) sees the release on Central and publishes. A deployment that is Dropped leaves npm
# untouched; the only half-release left is an npm publish that fails after Maven is published, and
# that is finished by re-running the npm job, which never publishes a version twice.
#
# npm authenticates by trusted publishing (OIDC): npmjs trusts this repository, this file and the
# `npm-publish` environment, and no token is stored. Provenance is attached to the published
# version. A dispatch never publishes to npm, whatever `upload` says: it packs, and runs
# `npm publish --dry-run`.
#
# Required repository (or organisation) secrets:
#   GPG_PRIVATE_KEY         armoured private key whose public half is on a keyserver Central reads
#   GPG_PASSPHRASE          its passphrase
#   CENTRAL_TOKEN_USERNAME  Central Portal user token, username half (central.sonatype.com/usertoken)
#   CENTRAL_TOKEN_PASSWORD  Central Portal user token, password half
# Optional:
#   NPM_TOKEN               npm granular access token with publish rights on @exeris/codegen-ts.
#                           A fallback for when trusted publishing is not configured: npm tries
#                           OIDC first and uses the token only when that fails.

on:
  push:
    tags:
      # Permissive on purpose: the strict check is a step, not this filter. A filter decides what
      # runs; it is not a guard.
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build for a DRY RUN (e.g. 0.9.0) — must not end in -SNAPSHOT'
        required: true
        type: string
      upload:
        description: 'Upload to Central. Normally leave UNCHECKED — a real release is a tag.'
        required: true
        type: boolean
        default: false

jobs:
  release:
    name: build, sign, gate, publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write       # SLSA provenance signing (Sigstore, keyless)
      attestations: write   # writing the attestation back to the repository
    outputs:
      version: ${{ steps.rel.outputs.version }}
      upload: ${{ steps.rel.outputs.upload }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the version and refuse an unreleasable one
        id: rel
        # Every `${{ }}` this step needs is bound here and read as a shell variable below rather than
        # substituted into the script text: `inputs.version` is free-form text a dispatcher types.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          IN_VERSION: ${{ inputs.version }}
          IN_UPLOAD: ${{ inputs.upload }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "push" ]; then
            tag="${GITHUB_REF#refs/tags/}"
            # A release tag is exactly vMAJOR.MINOR.PATCH; `v0.9.0-rc1` is not a release and must not
            # become one by matching the trigger glob.
            if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$tag is not a release tag (expected vMAJOR.MINOR.PATCH). Nothing released." >&2
              exit 1
            fi
            version="${tag#v}"
            upload=true
          else
            version="${IN_VERSION:-}"
            upload="${IN_UPLOAD:-}"
          fi

          case "$version" in
            *-SNAPSHOT) echo "::error::Central refuses SNAPSHOT release versions." >&2; exit 1 ;;
          esac

          # Releases are cut from main. A tag ref says nothing about which branch its commit is on,
          # so compare against main: `behind` and `identical` both mean the commit is on main.
          if [ "$upload" = "true" ]; then
            if [ "$EVENT_NAME" = "push" ]; then
              contained="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status)"
              case "$contained" in
                identical|behind) echo "tag $tag points at a commit on main ($contained)" ;;
                *) echo "::error::tag $tag points at a commit that is NOT on main (compare: $contained)." >&2
                   echo "::error::Delete the tag, cut it from main, tag again. Nothing was uploaded." >&2
                   exit 1 ;;
              esac
            elif [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Upload from a dispatch is allowed on main only; this ref is $GITHUB_REF." >&2
              echo "::error::Re-run with upload unchecked to exercise the release path from here." >&2
              exit 1
            fi
          fi

          { echo "version=$version"; echo "upload=$upload"; } >> "$GITHUB_OUTPUT"
          echo "resolved: version=$version upload=$upload"

      - name: Refuse a ref that cannot build a release
        # `workflow_dispatch` only registers a workflow present on the default branch, so a ref can
        # carry this file while lacking what it drives. Maven treats `-P release` for an absent
        # profile as a warning and builds on, producing unsigned artifacts that fail much later with
        # a message naming neither the profile nor the cause.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          missing=""
          add() { missing="${missing:+$missing; }$1"; }
          grep -q '<id>release</id>' pom.xml || add "the 'release' profile in pom.xml"
          grep -q '<id>exeris-tooling-release</id>' exeris-app-bom/pom.xml \
            || add "the 'exeris-tooling-release' profile in exeris-app-bom/pom.xml"
          [ -f .github/maven-settings.xml ] || add ".github/maven-settings.xml (Central credentials)"
          [ -x tools/release-readiness/release-readiness.sh ] \
            || add "tools/release-readiness/release-readiness.sh (absent or not executable)"

          if [ -n "$missing" ]; then
            echo "::error::Ref $GITHUB_REF cannot build a release — missing: $missing" >&2
            if [ "$EVENT_NAME" = "push" ]; then
              echo "::error::The tagged commit does not carry the release machinery. Delete the tag," >&2
              echo "::error::land the release tooling on that branch, and cut the tag again." >&2
            else
              echo "::error::Dispatch against a branch that carries the release machinery." >&2
            fi
            exit 1
          fi
          echo "ok — this ref carries the release profile, the settings file and the readiness gate"

      # 25 is the release-bearing row of build.yml: the toolchain every gate ran against, and the
      # class-file level the Maven plugin imposes on a consumer's Maven JVM.
      - name: Set up JDK 25 and import the signing key
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          # The env var NAME, not the passphrase. It has to match the variable the build step
          # exports; without it the action configures its own default name, GPG_PASSPHRASE, the
          # plugin reads a variable nobody set, and signing fails with
          # `gpg: signing failed: No pinentry`.
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      # Every eu.exeris coordinate a release depends on is resolved from Maven Central. The cache
      # above is shared with build.yml, so it can hold a copy of an eu.exeris coordinate that was
      # installed from source or published elsewhere before its release, and Maven never
      # re-fetches a release it already holds. Purging them is what lets a pin that is not on
      # Central fail to resolve here.
      - name: Purge cached eu.exeris artefacts
        run: rm -rf ~/.m2/repository/eu/exeris

      - name: Set the release version — or, on a tag, check it
        # On a dispatch the tree is a -SNAPSHOT development line and setting the version is the
        # point of the dry run. On a tag the release PR has already set it, so a tag whose version
        # disagrees with the pom is a tag on the wrong commit, and `versions:set` would overwrite the
        # evidence. @exeris/codegen-ts versions in lockstep with the reactor, so its package.json is
        # held to the same version: one tag releases both or neither.
        env:
          EVENT_NAME: ${{ github.event_name }}
          WANT: ${{ steps.rel.outputs.version }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            have="$(python3 -c "import xml.etree.ElementTree as E; print(E.parse('pom.xml').getroot().find('{http://maven.apache.org/POM/4.0.0}version').text.strip())")"
            if [ "$have" != "$WANT" ]; then
              echo "::error::tag says $WANT, the pom at this commit says $have — the tag is on the wrong commit." >&2
              exit 1
            fi
            echo "pom version $have matches the tag"
            npm_have="$(python3 -c "import json; print(json.load(open('exeris-codegen-ts/package.json'))['version'])")"
            if [ "$npm_have" != "$WANT" ]; then
              echo "::error::tag says $WANT, exeris-codegen-ts/package.json says $npm_have — the release PR did not set both." >&2
              exit 1
            fi
            echo "exeris-codegen-ts/package.json version $npm_have matches the tag"
          else
            # processAllModules: exeris-app-bom has no parent (ADR-091), so without it versions:set
            # leaves the BOM and its two children on the SNAPSHOT. The BOM also names the tooling
            # version as a literal property, which versions:set does not touch. The readiness gate
            # checks both against the reactor version.
            mvn -B -ntp versions:set -DnewVersion="$WANT" -DprocessAllModules=true -DgenerateBackupPoms=false
            mvn -B -ntp versions:set-property -Dproperty=exeris.tooling.version -DnewVersion="$WANT" -DgenerateBackupPoms=false
            (cd exeris-codegen-ts && npm version "$WANT" --no-git-tag-version --ignore-scripts --allow-same-version)
          fi

      - name: Refuse a SNAPSHOT anywhere in the POMs
        # A release pins final upstream versions only (ROADMAP, Versioning policy). By this point the
        # reactor's own version is final, so any -SNAPSHOT left is a cross-repo pin. On a dispatch it
        # is reported and the build goes on, so the rest of the path can still be exercised.
        # Element values only, read by a parser: a comment that mentions a SNAPSHOT is not a pin.
        env:
          UPLOAD: ${{ steps.rel.outputs.upload }}
        run: |
          set -euo pipefail
          hits="$(git ls-files '*pom.xml' | python3 -c "
          import sys, xml.etree.ElementTree as E
          for p in sys.stdin.read().split():
              for el in E.parse(p).getroot().iter():
                  if el.text and '-SNAPSHOT' in el.text:
                      print(p + ': <' + el.tag.split('}')[-1] + '>' + el.text.strip())")"
          if [ -n "$hits" ]; then
            echo "$hits"
            if [ "$UPLOAD" = "true" ]; then
              echo "::error::SNAPSHOT pins in a release. Pin the final upstream versions first." >&2
              exit 1
            fi
            echo "::warning::SNAPSHOT pins present; a release from this tree would be refused."
          else
            echo "ok — no SNAPSHOT in any POM"
          fi

      - name: Build, sign, gate — and upload when this is a release
        # One Maven invocation, so the bytes the tests and gates ran against are the bytes uploaded.
        # The settings file carries only the Central credentials: everything resolves from Central.
        #
        # `exeris-tooling-release` is exeris-app-bom's copy of `release` (ADR-091). That BOM and the
        # two modules under it inherit nothing from the root POM, so without it they are built but
        # neither signed nor staged.
        env:
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          UPLOAD: ${{ steps.rel.outputs.upload }}
        run: |
          set -euo pipefail
          if [ "$UPLOAD" = "true" ]; then
            # autoPublish=false: this uploads a deployment and stops. waitUntil=validated makes it
            # block until Central has validated, so a missing file or signature fails here. Review
            # the results in the portal and press Publish there.
            mvn -B -ntp --settings .github/maven-settings.xml -P 'release,exeris-tooling-release' clean deploy
          else
            mvn -B -ntp --settings .github/maven-settings.xml -P 'release,exeris-tooling-release' clean verify
          fi

      - name: Release-readiness gate
        # Every published coordinate has its pom, jar, sources jar and javadoc jar, each with a good
        # signature; the Maven plugin carries its descriptor; maven.deploy.skip and both
        # <excludeArtifacts> lists agree; exeris-app-bom names the reactor version and the kernel and
        # SDK versions exeris-tooling-bom was tested against, none of them a SNAPSHOT. On the upload
        # path it runs after the upload, so it cannot stop one: what it guards is publication. The
        # deployment stays unpublished (autoPublish=false), and a failure here means Drop it in the
        # Central Portal instead of pressing Publish. On the dry run it is the only check.
        run: tools/release-readiness/release-readiness.sh

      - name: Attest build provenance (SLSA)
        # GPG says who held the key; provenance says which workflow, at which commit, on which runner
        # produced the artifact. Verify with
        # `gh attestation verify <file> --repo exeris-systems/exeris-tooling`.
        #
        # Upload path only: an attestation is written to the repository and to the public Rekor
        # transparency log, which has no delete, so a dry run must not create one.
        if: ${{ steps.rel.outputs.upload == 'true' }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            */target/*.jar
            !exeris-e2e-tests/target/*.jar

      - name: Upload the signed artifacts as a run artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ steps.rel.outputs.version }}
          path: |
            */target/*.jar
            */target/*.asc
            */target/*.pom
            target/*.asc
            target/*.pom
          if-no-files-found: warn
          retention-days: 90

  # The dry run of the npm half. Same checks as the publishing job, then a tarball and
  # `npm publish --dry-run`, which reports what it would upload and needs no credentials.
  npm-dry-run:
    name: npm — pack and publish --dry-run
    needs: release
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: exeris-codegen-ts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: exeris-codegen-ts/package-lock.json

      - name: Set the release version and refuse an unreleasable one
        env:
          WANT: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$WANT" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::$WANT is not a release version (MAJOR.MINOR.PATCH); npm never receives one." >&2
            exit 1
          fi
          npm version "$WANT" --no-git-tag-version --ignore-scripts --allow-same-version

      - name: npm ci + test
        run: |
          npm ci
          npm test

      # `npm pack` runs `prepack`, which cleans and rebuilds dist/, so the tarball holds what this
      # commit's sources compile to and nothing a previous build left behind.
      - name: Pack, and publish --dry-run
        run: |
          set -euo pipefail
          npm pack --pack-destination "$RUNNER_TEMP"
          npm publish --dry-run --access public

      - name: Upload the tarball as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-${{ needs.release.outputs.version }}
          path: ${{ runner.temp }}/*.tgz
          if-no-files-found: error
          retention-days: 14

  npm-publish:
    name: npm — publish @exeris/codegen-ts
    needs: release
    # A tag only. The Maven job has already refused a tag that is not vMAJOR.MINOR.PATCH, that is
    # not on main, or whose package.json disagrees with it; `needs` carries those refusals here.
    if: ${{ github.event_name == 'push' && needs.release.outputs.upload == 'true' }}
    runs-on: ubuntu-latest
    # npmjs's trusted-publisher entry names this environment, so a publish from any other job or
    # workflow is refused by the registry. A required reviewer on it is the hold point between
    # pressing Publish in the Central Portal and releasing the npm half.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write   # OIDC token exchanged for a short-lived npm publish credential
    defaults:
      run:
        working-directory: exeris-codegen-ts

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # registry-url writes an .npmrc for npmjs. Trusted publishing needs npm >= 11.5.1 and
      # Node >= 22.14.0; the step below checks the npm half.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: exeris-codegen-ts/package-lock.json

      - name: Refuse an unreleasable version or an npm without trusted publishing
        env:
          WANT: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          have="$(node -p "require('./package.json').version")"
          case "$have" in
            *-SNAPSHOT*) echo "::error::package.json is at $have; a SNAPSHOT is never published to npm." >&2; exit 1 ;;
          esac
          if ! printf '%s' "$have" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::package.json is at $have, not MAJOR.MINOR.PATCH. Nothing published." >&2
            exit 1
          fi
          if [ "$have" != "$WANT" ]; then
            echo "::error::package.json is at $have, the Maven release at $WANT. Nothing published." >&2
            exit 1
          fi
          npm_version="$(npm --version)"
          if ! node -e '
            const [a, b, c] = process.argv[1].split(".").map(Number);
            process.exit(a > 11 || (a === 11 && (b > 5 || (b === 5 && c >= 1))) ? 0 : 1);
          ' "$npm_version"; then
            echo "::error::npm $npm_version cannot use trusted publishing (needs >= 11.5.1)." >&2
            exit 1
          fi
          echo "publishing @exeris/codegen-ts@$have with npm $npm_version"

      - name: npm ci + test
        run: |
          npm ci
          npm test

      # The Maven half goes first because it is the half with an undo. Publishing in the Central
      # Portal is a person's action this workflow cannot observe, so the job looks for its result:
      # the release's POM on Maven Central. Central takes minutes to show a published release; past
      # the wait, re-run this job once it does.
      - name: Wait for the Maven release on Maven Central
        env:
          WANT: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          url="https://repo1.maven.org/maven2/eu/exeris/tooling/exeris-codegen-core/$WANT/exeris-codegen-core-$WANT.pom"
          for attempt in $(seq 1 30); do
            if curl -fsSIL -o /dev/null "$url"; then
              echo "Maven release $WANT is on Maven Central"
              exit 0
            fi
            echo "attempt $attempt: $url not on Maven Central yet"
            sleep 60
          done
          echo "::error::eu.exeris.tooling $WANT is not on Maven Central. Publish the deployment in the Central Portal, then re-run this job. Nothing was published to npm." >&2
          exit 1

      # A version npm already holds can never be published again, so a re-run after a successful
      # publish finds it and stops.
      - name: Publish to npmjs (trusted publishing, provenance)
        env:
          WANT: ${{ needs.release.outputs.version }}
          # Empty unless the fallback secret exists; OIDC is tried first either way.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if published="$(npm view "@exeris/codegen-ts@$WANT" version 2>/dev/null)" && [ "$published" = "$WANT" ]; then
            echo "@exeris/codegen-ts@$WANT is already on npmjs; nothing to publish."
            exit 0
          fi
          npm publish --provenance --access public
