name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

# One review per PR at a time. `synchronize` fires on every push, so without this a
# quick follow-up push leaves two full reviews running against different commits —
# the older one finishes and posts a verdict on code that no longer exists.
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # Drafts and dependency bumps do not need a full review pass. Draft PRs still
    # fire `opened`, and a bot PR would otherwise be reviewed once per push.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@9c41ed18ca8b2b2a17eaef4723d5092ccdebc814 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          track_progress: true

          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR. The repo is a Java 26 / Maven project in the Exeris
            open-core stack.

            Focus on:
            1. **Correctness** — bugs, edge cases, broken contracts, merge artifacts
               (duplicated sections, orphan blocks, etc.)
            2. **Scope** — does the diff match the PR title/description? Anything
               in scope that's missing? Anything out of scope that should be split?
            3. **Public API** — flag anything that would need deprecation handling
               before 1.0.0 freezes the contract
            4. **Build / publish** — POM correctness, missing javadoc/sources jars
               on publishable modules, Maven Central metadata gaps
            5. **Risk** — call out functional, security, performance risks
               explicitly (state "none" if applicable; don't pad)

            This repo ships its review gates as skills under `.claude/skills/`
            (determinism, Java/TS emitter parity, processor purity, kernel-target
            discipline, consumer-build contracts). When the diff touches a surface
            one of them owns, invoke that skill and fold its verdict into your
            review rather than re-deriving the rules from scratch.

            Skip cosmetic nits unless they affect the above. Be specific: cite
            `file:line`. Lead with blockers, then in-scope improvements, then
            non-blocking suggestions. End with a clear verdict
            (LGTM / Approve with nits / Request changes).

            Post your review as a single PR review (not many separate comments).
            Use inline comments only when they materially help — file:line in the
            text body is usually clearer.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh api:*),Bash(git log:*),Bash(git show:*),Bash(git diff:*),Bash(git status:*),Bash(git branch:*),Bash(git remote:*)"
