# An e2e project as exeris-initializr writes it (ADR-091 Amendment 5): the backend under backend/,
# built with the two passes its README documents, and the frontend's npm project, which this build
# checks but does not run. prebuild.groovy runs the initializr jar into generated/.
invoker.goals.1 = -f generated/backend/pom.xml -Dexeris.codegen.skip=true compile
invoker.goals.2 = -f generated/backend/pom.xml verify
