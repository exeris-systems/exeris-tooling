# The two-pass first build (ROADMAP D2), as README.md's quick start documents it.
#
# Pass 1 seeds the metadata: the annotation processor writes target/classes/exeris-metadata/*.json
# during compile, which runs after generate-sources, so generation has nothing to read yet.
invoker.goals.1 = -Dexeris.codegen.skip=true compile
# Pass 2 is an ordinary build: generate -> compile -> verify-capabilities -> verify-runtime ->
# the generated tests. No clean, which would delete the seeded metadata.
invoker.goals.2 = verify
# Pass 3 writes the effective POM, under the application's own `release` profile, for verify.groovy:
# the application must show its own blank metadata and inherit no publishing from the parent chain.
invoker.goals.3 = -P release org.apache.maven.plugins:maven-help-plugin:3.5.1:effective-pom -Doutput=target/effective-pom.xml
