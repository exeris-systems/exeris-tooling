# A backend-only project as exeris-initializr writes it (ADR-091 Amendment 5), built the way its
# README and first-build.sh build it. prebuild.groovy runs the initializr jar into generated/.
#
# Pass 1 seeds the metadata, pass 2 is an ordinary build; no clean between them (ROADMAP D2).
invoker.goals.1 = -f generated/pom.xml -Dexeris.codegen.skip=true compile
invoker.goals.2 = -f generated/pom.xml verify
