# The two-pass first build, as README.md's quick start documents it.
#
# Pass 1 seeds the metadata: the annotation processor writes target/classes/exeris-metadata/*.json
# during compile, which runs after generate-sources, so generation has nothing to read yet.
invoker.goals.1 = -Dexeris.codegen.skip=true compile
# Pass 2 generates the application and its integration tests and compiles both. Its build started
# with no src/test/generated-it/java, so exeris-app-parent's integration-test profile is inactive
# and Failsafe does not run.
invoker.goals.2 = verify
# Pass 3 starts with the root in place, as every build of a project that committed it does: the
# profile is active and Failsafe runs the integration tests.
invoker.goals.3 = verify
