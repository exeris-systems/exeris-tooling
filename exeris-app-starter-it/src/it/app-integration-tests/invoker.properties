# The two-pass first build, as README.md's quick start documents it.
#
# Pass 1 seeds the metadata: the annotation processor writes target/classes/exeris-metadata/*.json
# during compile, which runs after generate-sources, so generation has nothing to read yet.
invoker.goals.1 = -Dexeris.codegen.skip=true compile
# Pass 2 generates the application and its integration tests, compiles both, and runs the
# integration tests under the Failsafe execution exeris-app-parent binds.
invoker.goals.2 = verify
