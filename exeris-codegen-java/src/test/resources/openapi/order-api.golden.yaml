openapi: 3.1.0
info:
  title: Exeris API - Order API
  description: Customer order
  version: 1.0.0
servers:
- url: http://localhost:8080
  description: Development server
tags:
- name: Order
  description: Customer order
- name: Order Actions
  description: Custom actions for Order
paths:
  /orders:
    get:
      tags:
      - Order
      summary: "List Order, one page at a time"
      operationId: listOrder
      parameters:
      - name: page
        in: query
        description: Zero-based page index
        required: false
        schema:
          type: integer
          format: int32
          default: 0
          minimum: 0
      - name: size
        in: query
        description: Page size
        required: false
        schema:
          type: integer
          format: int32
          default: 20
          maximum: 100
          minimum: 1
      - name: sort
        in: query
        description: "<property>,<asc|desc>; unsorted, rows come in id order"
        required: false
        schema:
          type: string
          enum:
          - "amount,asc"
          - "amount,desc"
          - "dueOn,asc"
          - "dueOn,desc"
          - "orderNumber,asc"
          - "orderNumber,desc"
          - "placedAt,asc"
          - "placedAt,desc"
          - "status,asc"
          - "status,desc"
      - name: dueOn
        in: query
        description: Only rows whose dueOn equals this value
        required: false
        schema:
          type: string
          format: date
      - name: orderNumber
        in: query
        description: Only rows whose orderNumber equals this value
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: Only rows whose status equals this value
        required: false
        schema:
          type: string
      - name: urgent
        in: query
        description: Only rows whose urgent equals this value
        required: false
        schema:
          type: boolean
      responses:
        "200":
          description: One page of Order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderPage"
        "400":
          description: Bad request
        "500":
          description: Internal server error
    post:
      tags:
      - Order
      summary: Create new Order
      operationId: createOrder
      requestBody:
        description: Create Order request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderCreateDto"
        required: true
      responses:
        "201":
          description: Created Order
        "400":
          description: Bad request
        "500":
          description: Internal server error
  /orders/{id}:
    get:
      tags:
      - Order
      summary: Get Order by ID
      operationId: getOrderById
      parameters:
      - name: id
        in: path
        description: Entity ID (UUID)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Order details
        "400":
          description: Bad request
        "404":
          description: Not found
        "500":
          description: Internal server error
    put:
      tags:
      - Order
      summary: Update Order
      operationId: updateOrder
      parameters:
      - name: id
        in: path
        description: Entity ID (UUID)
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Update Order request
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderUpdateDto"
        required: true
      responses:
        "200":
          description: Updated Order
        "400":
          description: Bad request
        "409":
          description: Version conflict — re-read and retry
        "500":
          description: Internal server error
    delete:
      tags:
      - Order
      summary: Delete Order
      operationId: deleteOrder
      parameters:
      - name: id
        in: path
        description: Entity ID (UUID)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "204":
          description: Order deleted
        "400":
          description: Bad request
        "404":
          description: Not found
        "500":
          description: Internal server error
  /orders/{id}/actions/approve:
    post:
      tags:
      - Order Actions
      summary: Approve the order
      operationId: approveOrder
      parameters:
      - name: id
        in: path
        description: Entity ID (UUID)
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        description: Request for approve action
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderApproveRequest"
        required: true
      responses:
        "200":
          description: Action result
        "400":
          description: Bad request
        "404":
          description: Not found
        "409":
          description: Version conflict — re-read and retry
        "500":
          description: Internal server error
  /orders/{id}/actions/cancel:
    post:
      tags:
      - Order Actions
      summary: Execute cancel
      operationId: cancelOrder
      parameters:
      - name: id
        in: path
        description: Entity ID (UUID)
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: Action result
        "400":
          description: Bad request
        "404":
          description: Not found
        "409":
          description: Version conflict — re-read and retry
        "500":
          description: Internal server error
components:
  schemas:
    Order:
      type: object
      description: Customer order
      properties:
        id:
          type: string
          format: uuid
        orderNumber:
          type: string
          description: Human-facing order number
          maxLength: 32
          minLength: 3
          pattern: "^ORD-[0-9]+$"
        status:
          type: string
        amount:
          type: number
          maximum: 1000000
          minimum: 0
        urgent:
          type: boolean
        dueOn:
          type: string
          format: date
        placedAt:
          type: string
          format: date-time
        website:
          type: string
          format: uri
        tenantId:
          type: string
          format: uuid
          readOnly: true
        version:
          type: integer
          format: int64
          description: The version of the stored row
          readOnly: true
    OrderCreateDto:
      type: object
      description: DTO for creating Order
      properties:
        orderNumber:
          type: string
          description: Human-facing order number
          maxLength: 32
          minLength: 3
          pattern: "^ORD-[0-9]+$"
        status:
          type: string
        amount:
          type: number
          maximum: 1000000
          minimum: 0
        urgent:
          type: boolean
        dueOn:
          type: string
          format: date
        placedAt:
          type: string
          format: date-time
        website:
          type: string
          format: uri
      required:
      - orderNumber
    OrderUpdateDto:
      type: object
      description: DTO for updating Order
      properties:
        orderNumber:
          type: string
          description: Human-facing order number
          maxLength: 32
          minLength: 3
          pattern: "^ORD-[0-9]+$"
        status:
          type: string
        amount:
          type: number
          maximum: 1000000
          minimum: 0
        urgent:
          type: boolean
        dueOn:
          type: string
          format: date
        placedAt:
          type: string
          format: date-time
        website:
          type: string
          format: uri
        version:
          type: integer
          format: int64
          description: The version the update expects the stored row to have
    OrderPage:
      type: object
      description: One page of Order
      properties:
        content:
          type: array
          description: "The rows of this page, in the query's order"
          items:
            $ref: "#/components/schemas/Order"
        totalElements:
          type: integer
          format: int64
          description: The number of rows the query matched
        totalPages:
          type: integer
          format: int32
          description: The number of pages of size those rows fill
        size:
          type: integer
          format: int32
          description: The page size
        number:
          type: integer
          format: int32
          description: The zero-based page index
        first:
          type: boolean
          description: Whether this is the first page
        last:
          type: boolean
          description: Whether no page follows this one
      required:
      - content
      - first
      - last
      - number
      - size
      - totalElements
      - totalPages
    OrderApproveRequest:
      type: object
      description: Request for the approve action
      properties:
        note:
          type: string
